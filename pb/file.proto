syntax = "proto3";

package pb;

option go_package = "github.com/criyle/go-judge/pb";

message FileID { string fileID = 1; }

message FileGetRequest {
  message FileGetRequestItem{
    string fileID = 1;
    optional uint64 truncateLength = 2;
  }
  repeated FileGetRequestItem items = 1;
}

message FileAddRequest {
  optional string name = 1;
  bytes content = 2;
}

message FileGetResponse {
  message FileContent {
    string fileId = 1;
    bytes content = 2;
    uint64 length = 3;
  }
  repeated FileContent contents = 1;
}

message FileListResponse {
  map<string, string> fileIDs = 1;
}

message FileDeleteRequest {
  repeated string fileIDs = 1;
}

// FileContent is the chunk type for FileGetStream and FileAddStream.
message FileContent {
  optional string name = 1;
  bytes content = 2;
}
