syntax = "proto3";

package pb;

option go_package = "github.com/criyle/go-judge/pb";

message Response {
  message FileError {
    enum ErrorType {
      CopyInOpenFile = 0;
      CopyInCreateFile = 1;
      CopyInCopyContent = 2;

      CopyOutOpen = 3;
      CopyOutNotRegularFile = 4;
      CopyOutSizeExceeded = 5;
      CopyOutCreateFile = 6;
      CopyOutCopyContent = 7;

      CollectSizeExceeded = 8;

      Symlink = 9;
    }
    string name = 1;
    ErrorType type = 2;
    optional string message = 3;
  }

  message Result {
    enum StatusType {
      Invalid = 0;
      Accepted = 1;
      WrongAnswer = 2;      // Not used
      PartiallyCorrect = 3; // Not used
      MemoryLimitExceeded = 4;
      TimeLimitExceeded = 5;
      OutputLimitExceeded = 6;
      FileError = 7;
      NonZeroExitStatus = 8;
      Signalled = 9;
      DangerousSyscall = 10;
      JudgementFailed = 11;    // Not used
      InvalidInteraction = 12; // Not used
      InternalError = 13;
    }

    StatusType status = 1;
    int32 exitStatus = 2;
    optional string error = 3;
    uint64 time = 4;    // cpu time
    uint64 runTime = 8; // clock time
    uint64 procPeak = 10;
    uint64 memory = 5;
    map<string, bytes> files = 6;
    map<string, string> fileIDs = 7;
    repeated FileError fileError = 9;
    optional WorkspaceDiffResult workspaceDiff = 11;
  }

  // WorkspaceDiffResult is the diff of /w. changed and removed are set only for OK.
  message WorkspaceDiffResult {
    enum Status {
      OK = 0;
      TOO_MANY_FILES = 1;
      TOO_LARGE = 2;
    }
    message ChangedFile {
      string path = 1;
      string fileID = 2;
      uint64 size = 3;
    }
    message SkippedEntry {
      enum Reason {
        NOT_REGULAR = 0;
        INVALID_PATH = 1;
        OTHER_FILESYSTEM = 2;
      }
      bytes path = 1;
      Reason reason = 2;
    }
    Status status = 1;
    repeated ChangedFile changed = 2;
    repeated string removed = 3;
    repeated SkippedEntry skipped = 4;
    uint32 skippedTotal = 5;
  }
  optional string requestID = 1;
  repeated Result results = 2;
  optional string error = 3;
}
