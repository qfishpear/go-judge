syntax = "proto3";

package pb;

option go_package = "github.com/criyle/go-judge/pb";

import "google/protobuf/empty.proto";

message Request {
  message LocalFile { string src = 1; }

  message MemoryFile { bytes content = 1; }

  message CachedFile {
    string fileID = 1;
    optional bool forceCopy = 2;
  }

  message PipeCollector {
    string name = 1;
    int64 max = 2;
    optional bool pipe = 3;
  }

  message File {
    oneof file {
      LocalFile local = 1;
      MemoryFile memory = 2;
      CachedFile cached = 3;
      PipeCollector pipe = 4;

      // streamIn only valid in streaming RPC
      google.protobuf.Empty streamIn = 5;

      // streamOut only valid in streaming RPC
      google.protobuf.Empty streamOut = 6;
    }
  }

  message CmdType {
    repeated string args = 1;
    repeated string env = 2;
    repeated File files = 3;
    optional bool tty = 13;

    optional uint64 cpuTimeLimit = 4;
    optional uint64 clockTimeLimit = 5;
    optional uint64 memoryLimit = 6;
    optional uint64 stackLimit = 12;
    optional uint64 procLimit = 7;
    optional uint64 cpuRateLimit = 15;
    optional string cpuSetLimit = 17;
    optional bool dataSegmentLimit = 16;
    optional bool addressSpaceLimit = 19;

    map<string, File> copyIn = 8;
    map<string, string> symlinks = 18;

    repeated CmdCopyOutFile copyOut = 9;
    repeated CmdCopyOutFile copyOutCached = 10;
    // Deprecated: ignored by the executor.
    optional string copyOutDir = 11 [deprecated = true];
    optional uint64 copyOutMax = 14;
    optional bool copyOutTruncate = 20;
    // 0 or unset uses the server-wide -output-limit.
    optional uint64 outputLimit = 21;
  }

  message CmdCopyOutFile {
    string name = 1;
    optional bool optional = 2;
  }

  message CmdFdIndex {
    int32 index = 1;
    int32 fd = 2;
  }

  message PipeMap {
    CmdFdIndex in = 1;
    CmdFdIndex out = 2;
    optional bool proxy = 3;
    optional string name = 4;
    optional uint64 max = 5;
    optional bool disableZeroCopy = 6;
  }

  // ShmMap shares a single memfd-backed shared memory region between multiple
  // commands. The region is created by go-judge with the requested size and
  // sealed (shrink/grow/seal). Each entry in `targets` reserves a file
  // descriptor slot on the corresponding cmd; the slot in that cmd's `files`
  // list must be empty (oneof unset).
  message ShmMap {
    uint64 size = 1;
    repeated CmdFdIndex targets = 2;
  }

  optional string requestID = 1;
  repeated CmdType cmd = 2;
  repeated PipeMap pipeMapping = 3;
  repeated ShmMap shmMapping = 4;
}
